<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin — Abrigo da Márcia</title>
    <link rel="shortcut icon" href="../../favicon.ico" type="image/x-icon">
    <script>
        (function(){
            var t = localStorage.getItem('tema') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', t);
        })();
    </script>
    <link rel="stylesheet" href="../../styles/admin.css?v=5">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../js/supabase-config.js"></script>
</head>
<body class="auth-page">

    <button class="theme-toggle" aria-label="Alternar tema"></button>

    <div class="auth-card">
        <img class="logo" src="../../assets/images/AbrigodaMarcia_logo.png" alt="Logo Abrigo da Márcia">
        <h1>Painel Administrativo</h1>
        <p>Entre com seu e-mail e senha para acessar.</p>

        <div id="alert" class="alert alert-error"></div>

        <form id="login-form">
            <div class="form-group">
                <label for="email">E-mail</label>
                <input id="email" type="email" placeholder="admin@email.com" required autocomplete="email">
            </div>
            <div class="form-group">
                <label for="password">Senha</label>
                <input id="password" type="password" placeholder="••••••••" required autocomplete="current-password">
            </div>
            <button type="submit" id="submit-btn" class="btn btn-primary btn-full">Entrar</button>
        </form>
    </div>

    <script>
        const { createClient } = supabase;
        const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Se já autenticado, redirecionar direto
        sb.auth.getSession().then(function({ data }) {
            if (data.session) window.location.href = 'index.html';
        });

        const form     = document.getElementById('login-form');
        const alertEl  = document.getElementById('alert');
        const submitBtn = document.getElementById('submit-btn');

        function showError(msg) {
            alertEl.textContent = msg;
            alertEl.className = 'alert alert-error show';
        }

        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            submitBtn.disabled = true;
            submitBtn.textContent = 'Entrando…';
            alertEl.className = 'alert';

            const email    = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            const { error } = await sb.auth.signInWithPassword({ email, password });

            if (error) {
                showError('E-mail ou senha inválidos.');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Entrar';
                return;
            }

            window.location.href = 'index.html';
        });
    </script>
    <script src="../../js/theme-toggle.js"></script>
</body>
</html>
