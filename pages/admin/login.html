<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://hnbbjohjobvclinxclbw.supabase.co wss://hnbbjohjobvclinxclbw.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'">
    <title>Admin — Abrigo da Márcia</title>
    <link rel="shortcut icon" href="../../favicon.ico" type="image/x-icon">
    <script>
        (function(){
            var t = localStorage.getItem('tema') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', t);
        })();
    </script>
    <link rel="stylesheet" href="../../styles/admin.css?v=6">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../js/supabase-config.js"></script>
    <script src="../../js/admin-common.js"></script>
</head>
<body class="auth-page">

    <button class="theme-toggle" aria-label="Alternar tema"></button>

    <div class="auth-card">
        <img class="logo" src="../../assets/images/AbrigodaMarcia_logo.png" alt="Logo Abrigo da Márcia">

        <div id="alert" class="alert alert-error"></div>

        <!-- Passo 1: e-mail + senha -->
        <div id="password-step">
            <h1>Painel Administrativo</h1>
            <p>Entre com seu e-mail e senha para acessar.</p>
            <form id="login-form">
                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input id="email" type="email" placeholder="admin@email.com" required autocomplete="email">
                </div>
                <div class="form-group">
                    <label for="password">Senha</label>
                    <input id="password" type="password" placeholder="••••••••" required autocomplete="current-password">
                </div>
                <button type="submit" id="submit-btn" class="btn btn-primary btn-full">Entrar</button>
            </form>
        </div>

        <!-- Passo 2: código do segundo fator (2FA / TOTP) -->
        <div id="mfa-step" style="display:none">
            <h1>Verificação em duas etapas</h1>
            <p>Digite o código de 6 dígitos do seu aplicativo autenticador.</p>
            <form id="mfa-form">
                <div class="form-group">
                    <label for="mfa-code">Código</label>
                    <input id="mfa-code" type="text" inputmode="numeric" autocomplete="one-time-code"
                           pattern="[0-9]*" maxlength="6" placeholder="000000" required
                           style="letter-spacing:.4em; text-align:center; font-size:20px">
                </div>
                <button type="submit" id="mfa-btn" class="btn btn-primary btn-full">Verificar</button>
                <button type="button" id="mfa-cancel" class="btn btn-ghost btn-full" style="margin-top:8px">Cancelar e sair</button>
            </form>
        </div>
    </div>

    <script>
        // `sb` (client Supabase) vem de js/admin-common.js.

        const alertEl   = document.getElementById('alert');
        const submitBtn = document.getElementById('submit-btn');
        const mfaBtn    = document.getElementById('mfa-btn');
        let mfaFactorId = null;

        function showError(msg) {
            alertEl.textContent = msg;
            alertEl.className = 'alert alert-error show';
        }
        function clearError() { alertEl.className = 'alert'; }

        function showMfaStep() {
            document.getElementById('password-step').style.display = 'none';
            document.getElementById('mfa-step').style.display = '';
            document.getElementById('mfa-code').focus();
        }

        // Decide o destino conforme o nível de garantia (AAL) da sessão.
        // aal1 + fator cadastrado → precisa do código; senão → entra.
        async function routeAfterAuth() {
            const { data, error } = await sb.auth.mfa.getAuthenticatorAssuranceLevel();
            if (error) { window.location.href = 'index.html'; return; }
            if (data && data.nextLevel === 'aal2' && data.currentLevel !== 'aal2') {
                const factors = await sb.auth.mfa.listFactors();
                const totp = factors.data && factors.data.totp && factors.data.totp[0];
                mfaFactorId = totp ? totp.id : null;
                if (!mfaFactorId) { window.location.href = 'index.html'; return; }
                showMfaStep();
            } else {
                window.location.href = 'index.html';
            }
        }

        // Se já há sessão, decide direto (pode cair na etapa do código)
        sb.auth.getSession().then(function({ data }) {
            if (data.session) routeAfterAuth();
        });

        // Passo 1: senha
        document.getElementById('login-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            submitBtn.disabled = true;
            submitBtn.textContent = 'Entrando…';
            clearError();

            const email    = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const { error } = await sb.auth.signInWithPassword({ email, password });

            submitBtn.disabled = false;
            submitBtn.textContent = 'Entrar';
            if (error) { showError('E-mail ou senha inválidos.'); return; }
            await routeAfterAuth();
        });

        // Passo 2: código do 2FA
        document.getElementById('mfa-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            mfaBtn.disabled = true;
            mfaBtn.textContent = 'Verificando…';
            clearError();

            const code = document.getElementById('mfa-code').value.trim();
            const { error } = await sb.auth.mfa.challengeAndVerify({ factorId: mfaFactorId, code: code });

            mfaBtn.disabled = false;
            mfaBtn.textContent = 'Verificar';
            if (error) { showError('Código inválido. Tente novamente.'); return; }
            window.location.href = 'index.html';
        });

        // Cancelar a etapa do 2FA volta ao login limpo
        document.getElementById('mfa-cancel').addEventListener('click', async function() {
            await sb.auth.signOut();
            mfaFactorId = null;
            clearError();
            document.getElementById('mfa-step').style.display = 'none';
            document.getElementById('password-step').style.display = '';
            document.getElementById('login-form').reset();
        });
    </script>
    <script src="../../js/theme-toggle.js"></script>
</body>
</html>
