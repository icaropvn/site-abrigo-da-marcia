<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin · Histórias — Abrigo da Márcia</title>
    <link rel="shortcut icon" href="../../favicon.ico" type="image/x-icon">
    <script>
        (function(){
            var t = localStorage.getItem('tema') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', t);
        })();
    </script>
    <link rel="stylesheet" href="../../styles/admin.css?v=5">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../js/supabase-config.js"></script>
    <script src="../../js/icons.js"></script>
    <script src="../../js/admin-common.js"></script>
</head>
<body>

    <!-- ── Header ── -->
    <header class="admin-header">
        <div class="admin-header-left">
            <img src="../../assets/images/AbrigodaMarcia_logo.png" alt="Logo">
            <h1>Painel Admin</h1>
            <nav class="admin-nav">
                <a href="index.html">Cães</a>
                <a href="historias.html" class="active">Histórias</a>
                <a href="eventos.html">Eventos</a>
                <a href="seguranca.html">Segurança</a>
            </nav>
        </div>
        <div class="admin-header-right">
            <span class="admin-email" id="admin-email"></span>
            <button class="theme-toggle" aria-label="Alternar tema"></button>
            <button class="btn btn-ghost btn-sm" id="logout-btn">Sair</button>
        </div>
    </header>

    <!-- ── Main ── -->
    <main class="admin-main">

        <!-- Stats -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-value" id="stat-total">—</div>
                <div class="stat-label">Total de histórias</div>
            </div>
            <div class="stat-card available">
                <div class="stat-value" id="stat-featured">—</div>
                <div class="stat-label">Em destaque na home</div>
            </div>
        </div>

        <!-- Tabela -->
        <div class="section-header">
            <h2>Histórias cadastradas</h2>
            <button class="btn btn-primary" id="add-story-btn">+ Adicionar história</button>
        </div>

        <div class="table-wrap">
            <table class="t-stories">
                <thead>
                    <tr>
                        <th>Foto</th>
                        <th>Cão</th>
                        <th>Fotos</th>
                        <th>Destaque</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="stories-tbody">
                    <tr class="loading-row"><td colspan="5">Carregando…</td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <!-- ── Modal: formulário adicionar/editar ── -->
    <div class="modal-overlay" id="story-modal">
        <div class="modal-box">
            <button class="modal-close-btn" id="modal-close">&times;</button>
            <h2 id="modal-title">Adicionar história</h2>

            <div id="form-alert" class="alert"></div>

            <form id="story-form">
                <input type="hidden" id="story-id">

                <div class="form-group">
                    <label for="f-dog-name">Nome do cão *</label>
                    <input id="f-dog-name" type="text" required placeholder="Ex: Thor">
                </div>

                <div class="form-group">
                    <label for="f-description">História *</label>
                    <textarea id="f-description" required maxlength="600" placeholder="Conte a história deste cão e como ele encontrou um lar…"></textarea>
                    <small id="desc-counter" style="color:var(--gray);align-self:flex-end">0/600</small>
                </div>

                <div class="form-group">
                    <label style="flex-direction:row;cursor:pointer">
                        <input type="checkbox" id="f-featured"> Destacar na home
                        <span class="tooltip-icon" tabindex="0" data-tip="Histórias em destaque aparecem na prévia da página inicial (até 3).">?</span>
                    </label>
                </div>

                <div class="form-group">
                    <label>Fotos <span class="photos-counter" id="photos-counter">(0/5)</span></label>
                    <div class="photos-grid" id="photos-grid"></div>
                    <input type="file" id="f-photos" accept="image/jpeg,image/jpg,image/png,image/webp" multiple style="display:none">
                    <small style="color:#868686">Até 5 fotos. Formatos: JPG, PNG, WebP. Máximo 5 MB cada.</small>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-ghost" id="modal-cancel">Cancelar</button>
                    <button type="submit" class="btn btn-primary" id="save-btn">Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- ── Confirm delete ── -->
    <div class="confirm-overlay" id="confirm-overlay">
        <div class="confirm-box">
            <h3>Remover história?</h3>
            <p id="confirm-msg">Esta ação não pode ser desfeita.</p>
            <div class="confirm-actions">
                <button class="btn btn-ghost" id="confirm-cancel">Cancelar</button>
                <button class="btn btn-danger" id="confirm-ok">Remover</button>
            </div>
        </div>
    </div>

    <script>
    (function() {
        // `sb` (client Supabase) vem de js/admin-common.js.

        // Ícones SVG inline (currentColor acompanha o tema claro/escuro).
        // ICON_DOG/ICON_STAR vêm de js/icons.js (width=1em → tamanho herda o font-size).
        const ICON_DOG = ICON_DOG_SVG;
        const ICON_STAR = ICON_STAR_SVG;

        const MAX_PHOTOS = 5;
        let allStories = [];
        let pendingDeleteId = null;
        let editingId = null;
        // Itens de foto: { url: string|null, file: File|null, preview: string }
        let photoItems = [];

        // esc() e slugify() vêm de js/admin-common.js.

        // ── Auth guard ──────────────────────────────────────────
        async function init() {
            // requireAdminSession (admin-common.js): valida sessão + AAL2 e preenche #admin-email
            if (!await requireAdminSession()) return;
            await loadStories();
            bindEvents();
        }

        document.getElementById('logout-btn').addEventListener('click', async function() {
            await sb.auth.signOut();
            window.location.href = 'login.html';
        });

        // ── Load ────────────────────────────────────────────────
        async function loadStories() {
            const { data, error } = await sb
                .from('stories')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) { showTableError(error.message); return; }

            allStories = data || [];
            renderTable(allStories);
            renderStats(allStories);
        }

        function renderStats(stories) {
            document.getElementById('stat-total').textContent    = stories.length;
            document.getElementById('stat-featured').textContent  = stories.filter(s => s.featured).length;
        }

        function renderTable(stories) {
            const tbody = document.getElementById('stories-tbody');
            tbody.innerHTML = '';
            if (!stories.length) {
                const tr = document.createElement('tr');
                tr.className = 'loading-row';
                const td = document.createElement('td');
                td.setAttribute('colspan', '5');
                td.textContent = 'Nenhuma história cadastrada.';
                tr.appendChild(td);
                tbody.appendChild(tr);
                return;
            }
            stories.forEach(function(story) {
                const photos = story.photos || [];
                const cover  = photos.length ? photos[0] : null;
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>
                        ${cover ? `<img class="dog-thumb" src="${esc(cover)}" alt="${esc(story.dog_name)}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">` : ''}
                        <div class="dog-no-img" style="display:${cover ? 'none' : 'flex'}">${ICON_DOG}</div>
                    </td>
                    <td><strong>${esc(story.dog_name)}</strong></td>
                    <td>${photos.length}</td>
                    <td>${story.featured ? ICON_STAR : '—'}</td>
                    <td>
                        <div class="actions">
                            <button class="btn btn-edit btn-sm js-edit" data-id="${esc(story.id)}">Editar</button>
                            <button class="btn btn-danger btn-sm js-delete" data-id="${esc(story.id)}" data-name="${esc(story.dog_name)}">Remover</button>
                        </div>
                    </td>`;
                tbody.appendChild(tr);
            });
        }

        function showTableError(msg) {
            const tbody = document.getElementById('stories-tbody');
            tbody.innerHTML = '';
            const tr = document.createElement('tr');
            tr.className = 'loading-row';
            const td = document.createElement('td');
            td.setAttribute('colspan', '5');
            td.textContent = 'Erro: ' + msg;
            tr.appendChild(td);
            tbody.appendChild(tr);
        }

        // ── Table action delegation ─────────────────────────────
        document.getElementById('stories-tbody').addEventListener('click', function(e) {
            const editBtn   = e.target.closest('.js-edit');
            const deleteBtn = e.target.closest('.js-delete');
            if (editBtn) {
                const story = allStories.find(s => s.id === editBtn.dataset.id);
                if (story) openModal(story);
            } else if (deleteBtn) {
                pendingDeleteId = deleteBtn.dataset.id;
                document.getElementById('confirm-msg').textContent =
                    'Remover a história de "' + deleteBtn.dataset.name + '" permanentemente? Esta ação não pode ser desfeita.';
                document.getElementById('confirm-overlay').classList.add('open');
            }
        });

        // ── Add / Edit modal ────────────────────────────────────
        document.getElementById('add-story-btn').addEventListener('click', function() {
            openModal(null);
        });

        function openModal(story) {
            editingId = story ? story.id : null;
            document.getElementById('modal-title').textContent = story ? 'Editar história' : 'Adicionar história';
            document.getElementById('story-id').value      = story ? story.id : '';
            document.getElementById('f-dog-name').value     = story ? story.dog_name : '';
            document.getElementById('f-description').value  = story ? story.description : '';
            updateDescCounter();
            document.getElementById('f-featured').checked   = story ? !!story.featured : false;
            document.getElementById('f-photos').value       = '';
            document.getElementById('form-alert').className = 'alert';

            photoItems = (story && story.photos ? story.photos : []).map(function(url) {
                return { url: url, file: null, preview: url };
            });
            renderPhotos();

            document.getElementById('story-modal').classList.add('open');
        }

        function closeModal() {
            document.getElementById('story-modal').classList.remove('open');
            editingId = null;
            photoItems = [];
        }

        document.getElementById('modal-close').addEventListener('click', closeModal);
        document.getElementById('modal-cancel').addEventListener('click', closeModal);
        document.getElementById('story-modal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });

        // ── Contador de caracteres da história ──────────────────
        function updateDescCounter() {
            const el = document.getElementById('f-description');
            document.getElementById('desc-counter').textContent = el.value.length + '/600';
        }
        document.getElementById('f-description').addEventListener('input', updateDescCounter);

        // ── Photos grid ─────────────────────────────────────────
        function renderPhotos() {
            const grid = document.getElementById('photos-grid');
            grid.innerHTML = '';
            photoItems.forEach(function(item, i) {
                const cell = document.createElement('div');
                cell.className = 'photo-thumb';
                cell.innerHTML = `
                    <img src="${esc(item.preview)}" alt="Foto ${i + 1}">
                    <button type="button" class="photo-remove" data-index="${i}" aria-label="Remover foto">&times;</button>`;
                grid.appendChild(cell);
            });
            if (photoItems.length < MAX_PHOTOS) {
                const add = document.createElement('button');
                add.type = 'button';
                add.className = 'photos-add';
                add.id = 'photos-add-btn';
                add.innerHTML = '<span>+</span>Adicionar';
                grid.appendChild(add);
            }
            document.getElementById('photos-counter').textContent = '(' + photoItems.length + '/' + MAX_PHOTOS + ')';
        }

        document.getElementById('photos-grid').addEventListener('click', function(e) {
            const removeBtn = e.target.closest('.photo-remove');
            const addBtn    = e.target.closest('#photos-add-btn');
            if (removeBtn) {
                photoItems.splice(parseInt(removeBtn.dataset.index, 10), 1);
                renderPhotos();
            } else if (addBtn) {
                document.getElementById('f-photos').click();
            }
        });

        document.getElementById('f-photos').addEventListener('change', function() {
            const files = Array.from(this.files || []);
            this.value = '';
            files.forEach(function(file) {
                if (photoItems.length >= MAX_PHOTOS) return;
                if (file.size > 5 * 1024 * 1024) {
                    showFormAlert('Cada imagem deve ter no máximo 5 MB. "' + file.name + '" foi ignorada.', 'error');
                    return;
                }
                const reader = new FileReader();
                reader.onload = function(ev) {
                    photoItems.push({ url: null, file: file, preview: ev.target.result });
                    renderPhotos();
                };
                reader.readAsDataURL(file);
            });
        });

        // ── Save ────────────────────────────────────────────────
        document.getElementById('story-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const saveBtn = document.getElementById('save-btn');
            saveBtn.disabled = true;
            saveBtn.textContent = 'Salvando…';

            try {
                const dogName = document.getElementById('f-dog-name').value.trim();
                const slug    = slugify(dogName, 'historia');
                const photos  = [];

                for (const item of photoItems) {
                    if (item.file) {
                        const ext  = item.file.name.split('.').pop().toLowerCase();
                        const path = `stories/${slug}-${Date.now()}-${Math.random().toString(36).slice(2, 7)}.${ext}`;
                        const { error: uploadErr } = await sb.storage
                            .from('dog-photos')
                            .upload(path, item.file, { upsert: true });
                        if (uploadErr) throw uploadErr;
                        const { data: urlData } = sb.storage.from('dog-photos').getPublicUrl(path);
                        photos.push(urlData.publicUrl);
                    } else if (item.url) {
                        photos.push(item.url);
                    }
                }

                const payload = {
                    dog_name:    dogName,
                    description: document.getElementById('f-description').value.trim(),
                    featured:    document.getElementById('f-featured').checked,
                    photos:      photos
                };

                let error;
                if (editingId) {
                    ({ error } = await sb.from('stories').update(payload).eq('id', editingId));
                } else {
                    ({ error } = await sb.from('stories').insert(payload));
                }
                if (error) throw error;

                closeModal();
                await loadStories();
            } catch (err) {
                showFormAlert(err.message || 'Erro ao salvar.', 'error');
            } finally {
                saveBtn.disabled = false;
                saveBtn.textContent = 'Salvar';
            }
        });

        function showFormAlert(msg, type) {
            const el = document.getElementById('form-alert');
            el.textContent = msg;
            el.className   = `alert alert-${type} show`;
        }

        // ── Delete ──────────────────────────────────────────────
        document.getElementById('confirm-cancel').addEventListener('click', function() {
            document.getElementById('confirm-overlay').classList.remove('open');
            pendingDeleteId = null;
        });

        document.getElementById('confirm-ok').addEventListener('click', async function() {
            if (!pendingDeleteId) return;
            document.getElementById('confirm-overlay').classList.remove('open');
            const { error } = await sb.from('stories').delete().eq('id', pendingDeleteId);
            pendingDeleteId = null;
            if (error) { alert('Erro ao remover: ' + error.message); return; }
            await loadStories();
        });

        function bindEvents() {
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') {
                    closeModal();
                    document.getElementById('confirm-overlay').classList.remove('open');
                }
            });
        }

        init();
    })();
    </script>
    <script src="../../js/theme-toggle.js"></script>
</body>
</html>
